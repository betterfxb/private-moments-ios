name: iOS validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.profile }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: compact-light
            family: compact
            appearance: light
            text_size: large
            gallery_only: '0'
          - profile: phone-dark
            family: phone
            appearance: dark
            text_size: large
            gallery_only: '1'
          - profile: ipad-light
            family: ipad
            appearance: light
            text_size: large
            gallery_only: '1'
          - profile: compact-dark-accessibility
            family: compact
            appearance: dark
            text_size: accessibility-extra-extra-extra-large
            gallery_only: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run project audits
        run: |
          node tools/audit-localization.mjs
          node tools/audit-xcode-project.mjs
          node tools/audit-release-materials.mjs

      - name: Select and verify pinned UI toolchain
        run: python3 tools/distribute.py select-toolchain

      - name: Select and configure simulator
        shell: bash
        env:
          SIMULATOR_FAMILY: ${{ matrix.family }}
          SIMULATOR_APPEARANCE: ${{ matrix.appearance }}
          SIMULATOR_TEXT_SIZE: ${{ matrix.text_size }}
        run: |
          destination="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import os
          import subprocess
          import sys

          devices_by_runtime = json.load(sys.stdin).get("devices", {})
          sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          expected_runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + "-".join(sdk.split(".")[:2])
          for runtime in sorted(devices_by_runtime, reverse=True):
              if runtime != expected_runtime:
                  continue
              devices = [d for d in devices_by_runtime[runtime] if d.get("isAvailable")]
              family = os.environ["SIMULATOR_FAMILY"]
              if family == "compact":
                  preferences = ["iPhone SE (3rd generation)", "iPhone 16e", "iPhone 17e", "iPhone 16", "iPhone 17"]
                  devices = [d for name in preferences for d in devices if d["name"] == name]
              elif family == "ipad":
                  devices = [d for d in devices if d["name"].startswith("iPad")]
              else:
                  devices = [d for d in devices if d["name"].startswith("iPhone")]
              if devices:
                  device = devices[0]
                  print("Selected: {} ({})".format(device["name"], runtime), file=sys.stderr)
                  print("platform=iOS Simulator,id={}".format(device["udid"]))
                  raise SystemExit(0)
          raise SystemExit("No simulator matched the pinned SDK runtime and required device profile.")
          ')"
          echo "IOS_SIMULATOR_DESTINATION=$destination" >> "$GITHUB_ENV"
          printf 'Selected simulator: %s\n' "$destination"
          simulator_id="${destination##*id=}"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl ui "$simulator_id" appearance "$SIMULATOR_APPEARANCE"
          xcrun simctl ui "$simulator_id" content_size "$SIMULATOR_TEXT_SIZE"

      - name: Build Debug and Release, then run XCTest
        env:
          PRIVATE_MOMENTS_DERIVED_DATA: ${{ runner.temp }}/PrivateMomentsDerivedData
          PRIVATE_MOMENTS_RESULT_BUNDLE: ${{ runner.temp }}/PrivateMoments.xcresult
          PRIVATE_MOMENTS_UI_GALLERY_ONLY: ${{ matrix.gallery_only }}
        run: bash scripts/verify-mac.sh

      - name: Export XCTest UI screenshots
        if: always()
        shell: bash
        run: |
          result_bundle="${RUNNER_TEMP}/PrivateMoments.xcresult"
          screenshot_directory="${RUNNER_TEMP}/PrivateMomentsUIScreenshots"
          if [[ ! -d "$result_bundle" ]]; then
            printf 'No XCTest result bundle was produced; skipping screenshot export.\n'
            exit 0
          fi
          mkdir -p "$screenshot_directory"
          xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$screenshot_directory"
          screenshot_count="$(find "$screenshot_directory" -type f -iname '*.png' | wc -l | tr -d ' ')"
          printf 'Exported %s PNG attachment(s).\n' "$screenshot_count"

      - name: Upload XCTest UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-moments-ui-screenshots-${{ matrix.profile }}
          path: ${{ runner.temp }}/PrivateMomentsUIScreenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-moments-xcresult-${{ matrix.profile }}
          path: ${{ runner.temp }}/PrivateMoments.xcresult
          if-no-files-found: ignore
          retention-days: 7
