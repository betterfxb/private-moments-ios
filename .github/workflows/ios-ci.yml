name: iOS validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backup_smoke:
        description: Run selected-profile backup unit and file flow (not full acceptance)
        type: boolean
        default: false
      backup_smoke_language:
        description: Language for explicit backup smoke (zh-Hans requires backup_smoke)
        type: choice
        default: en
        options:
          - en
          - zh-Hans
      input_smoke:
        description: Run selected-profile input gallery only (not full acceptance)
        type: boolean
        default: false
      rotation_smoke:
        description: Run iPad light/Large rotation continuity only (requires ipad-light profile)
        type: boolean
        default: false
      backup_smoke_profile:
        description: Device profile for focused diagnosis (ignored by full acceptance)
        type: choice
        default: compact-light
        options:
          - compact-light
          - phone-dark
          - ipad-light
          - compact-dark-accessibility
          - ipad-light-accessibility

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        env:
          MATRIX_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.rotation_smoke && 'rotation' || github.event_name == 'workflow_dispatch' && inputs.input_smoke && 'input' || github.event_name == 'workflow_dispatch' && inputs.backup_smoke && 'backup' || 'full' }}
          SMOKE_PROFILE: ${{ inputs.backup_smoke_profile || 'compact-light' }}
          INPUT_SMOKE: ${{ inputs.input_smoke && '1' || '0' }}
          BACKUP_SMOKE: ${{ inputs.backup_smoke && '1' || '0' }}
          BACKUP_LANGUAGE: ${{ inputs.backup_smoke_language || 'en' }}
          ROTATION_SMOKE: ${{ inputs.rotation_smoke && '1' || '0' }}
        run: |
          if [[ "$ROTATION_SMOKE" == "1" && ( "$INPUT_SMOKE" == "1" || "$BACKUP_SMOKE" == "1" ) ]]; then
            printf 'Rotation, input and backup smoke modes are mutually exclusive.\n' >&2
            exit 1
          fi
          if [[ "$INPUT_SMOKE" == "1" && "$BACKUP_SMOKE" == "1" ]]; then
            printf 'Input and backup smoke modes are mutually exclusive.\n' >&2
            exit 1
          fi
          if [[ "$BACKUP_LANGUAGE" != "en" && "$BACKUP_LANGUAGE" != "zh-Hans" ]] ||
             [[ "$BACKUP_LANGUAGE" == "zh-Hans" && "$BACKUP_SMOKE" != "1" ]]; then
            printf 'Chinese backup language requires explicit backup smoke.\n' >&2
            exit 1
          fi
          python3 -m unittest discover -s tools -p 'test_ui_test_matrix.py' -v
          matrix="$(python3 tools/ui-test-matrix.py "$MATRIX_SCOPE" --smoke-profile "$SMOKE_PROFILE")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: plan
    name: ${{ matrix.profile }}
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run project audits
        run: |
          node tools/audit-localization.mjs
          node tools/audit-xcode-project.mjs
          node tools/audit-release-materials.mjs

      - name: Select and verify pinned UI toolchain
        run: python3 tools/distribute.py select-toolchain

      - name: Select and configure simulator
        shell: bash
        env:
          SIMULATOR_FAMILY: ${{ matrix.family }}
          SIMULATOR_APPEARANCE: ${{ matrix.appearance }}
          SIMULATOR_TEXT_SIZE: ${{ matrix.text_size }}
        run: |
          destination="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import os
          import subprocess
          import sys

          devices_by_runtime = json.load(sys.stdin).get("devices", {})
          sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          expected_runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + "-".join(sdk.split(".")[:2])
          for runtime in sorted(devices_by_runtime, reverse=True):
              if runtime != expected_runtime:
                  continue
              devices = [d for d in devices_by_runtime[runtime] if d.get("isAvailable")]
              family = os.environ["SIMULATOR_FAMILY"]
              if family == "compact":
                  preferences = ["iPhone SE (3rd generation)", "iPhone 16e", "iPhone 17e", "iPhone 16", "iPhone 17"]
                  devices = [d for name in preferences for d in devices if d["name"] == name]
              elif family == "ipad":
                  devices = [d for d in devices if d["name"].startswith("iPad")]
              else:
                  devices = [d for d in devices if d["name"].startswith("iPhone")]
              if devices:
                  device = devices[0]
                  print("Selected: {} ({})".format(device["name"], runtime), file=sys.stderr)
                  print("platform=iOS Simulator,id={}".format(device["udid"]))
                  raise SystemExit(0)
          raise SystemExit("No simulator matched the pinned SDK runtime and required device profile.")
          ')"
          echo "IOS_SIMULATOR_DESTINATION=$destination" >> "$GITHUB_ENV"
          printf 'Selected simulator: %s\n' "$destination"
          simulator_id="${destination##*id=}"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl ui "$simulator_id" appearance "$SIMULATOR_APPEARANCE"
          xcrun simctl ui "$simulator_id" content_size "$SIMULATOR_TEXT_SIZE"

      - name: Build Debug and Release, then run XCTest
        env:
          PRIVATE_MOMENTS_DERIVED_DATA: ${{ runner.temp }}/PrivateMomentsDerivedData
          PRIVATE_MOMENTS_RESULT_BUNDLE: ${{ runner.temp }}/PrivateMoments.xcresult
          PRIVATE_MOMENTS_UI_GALLERY_ONLY: ${{ matrix.gallery_only }}
          PRIVATE_MOMENTS_UI_BACKUP_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_smoke && '1' || '0' }}
          PRIVATE_MOMENTS_UI_BACKUP_LANGUAGE: ${{ inputs.backup_smoke_language || 'en' }}
          PRIVATE_MOMENTS_UI_INPUT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.input_smoke && '1' || '0' }}
          PRIVATE_MOMENTS_UI_ROTATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.rotation_smoke && '1' || '0' }}
          PRIVATE_MOMENTS_UI_IPAD_TESTS: ${{ matrix.family == 'ipad' && '1' || '0' }}
        run: bash scripts/verify-mac.sh

      - name: Read backup flow diagnostics
        if: ${{ always() && env.IOS_SIMULATOR_DESTINATION != '' }}
        run: |
          simulator_id="${IOS_SIMULATOR_DESTINATION##*id=}"
          xcrun simctl spawn "$simulator_id" log show --last 30m --style compact \
            --predicate '(process == "PrivateMoments" AND subsystem != "com.apple.dt.xctest") OR subsystem BEGINSWITH "com.apple.DocumentManager"'

      - name: Export XCTest UI screenshots
        if: always()
        shell: bash
        run: |
          result_bundle="${RUNNER_TEMP}/PrivateMoments.xcresult"
          screenshot_directory="${RUNNER_TEMP}/PrivateMomentsUIScreenshots"
          if [[ ! -d "$result_bundle" ]]; then
            printf 'No XCTest result bundle was produced; skipping screenshot export.\n'
            exit 0
          fi
          mkdir -p "$screenshot_directory"
          xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$screenshot_directory"
          screenshot_count="$(find "$screenshot_directory" -type f -iname '*.png' | wc -l | tr -d ' ')"
          printf 'Exported %s PNG attachment(s).\n' "$screenshot_count"

      - name: Upload XCTest UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-moments-ui-screenshots-${{ matrix.profile }}
          path: ${{ runner.temp }}/PrivateMomentsUIScreenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: private-moments-xcresult-${{ matrix.profile }}
          path: ${{ runner.temp }}/PrivateMoments.xcresult
          if-no-files-found: ignore
          retention-days: 7
